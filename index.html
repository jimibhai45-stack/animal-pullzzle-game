<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animal Memory Puzzle</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #7ee8fa, #80ff72);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.game-container {
    width: 100%;
    max-width: 450px;
    text-align: center;
}

h1 {
    color: #ffffff;
    margin-bottom: 15px;
    text-shadow: 2px 2px 5px rgba(0,0,0,.25);
}

.info {
    background: white;
    padding: 12px;
    border-radius: 15px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-around;
    font-weight: bold;
    box-shadow: 0 5px 15px rgba(0,0,0,.15);
}

.game-board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.card {
    aspect-ratio: 1 / 1;
    perspective: 800px;
    cursor: pointer;
}

.card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform .45s;
    transform-style: preserve-3d;
}

.card.flip .card-inner {
    transform: rotateY(180deg);
}

.card-front,
.card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,.20);
}

.card-front {
    background: linear-gradient(135deg, #ff9966, #ff5e62);
    color: white;
    font-size: 35px;
}

.card-back {
    background: white;
    font-size: 45px;
    transform: rotateY(180deg);
}

.card.matched .card-back {
    background: #c8ffb0;
}

button {
    margin-top: 18px;
    border: none;
    padding: 13px 30px;
    border-radius: 30px;
    background: #222;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.95);
}

.win-message {
    display: none;
    background: white;
    margin-top: 15px;
    padding: 15px;
    border-radius: 15px;
    font-size: 20px;
    font-weight: bold;
}

@media(max-width:400px) {
    .game-board {
        gap: 7px;
    }

    .card-back {
        font-size: 36px;
    }
}
</style>
</head>

<body>

<div class="game-container">

<h1>🐾 Animal Memory 🐾</h1>

<div class="info">
    <span>Moves: <span id="moves">0</span></span>
    <span>Time: <span id="timer">0</span>s</span>
    <span>Score: <span id="score">0</span></span>
</div>

<div class="game-board" id="gameBoard"></div>

<div class="win-message" id="winMessage">
    🎉 Congratulations! You matched all animals!
</div>

<button onclick="startGame()">🔄 Restart Game</button>

</div>

<script>

const animals = [
    "🐶",
    "🐱",
    "🦁",
    "🐼",
    "🐵",
    "🐰",
    "🐯",
    "🐨"
];

let cards = [];
let firstCard = null;
let secondCard = null;
let lockBoard = false;

let moves = 0;
let score = 0;
let matchedPairs = 0;
let time = 0;
let timerInterval = null;
let timerStarted = false;

function startGame() {

    clearInterval(timerInterval);

    const board = document.getElementById("gameBoard");

    board.innerHTML = "";

    document.getElementById("winMessage").style.display = "none";

    moves = 0;
    score = 0;
    matchedPairs = 0;
    time = 0;

    firstCard = null;
    secondCard = null;

    lockBoard = false;
    timerStarted = false;

    document.getElementById("moves").textContent = moves;
    document.getElementById("score").textContent = score;
    document.getElementById("timer").textContent = time;

    cards = [...animals, ...animals];

    cards.sort(() => Math.random() - 0.5);

    cards.forEach(animal => {

        const card = document.createElement("div");

        card.classList.add("card");

        card.dataset.animal = animal;

        card.innerHTML = `
            <div class="card-inner">

                <div class="card-front">
                    ❓
                </div>

                <div class="card-back">
                    ${animal}
                </div>

            </div>
        `;

        card.addEventListener("click", flipCard);

        board.appendChild(card);
    });
}

function startTimer() {

    if (timerStarted) return;

    timerStarted = true;

    timerInterval = setInterval(() => {

        time++;

        document.getElementById("timer").textContent = time;

    }, 1000);
}

function flipCard() {

    startTimer();

    if (lockBoard) return;

    if (this === firstCard) return;

    if (this.classList.contains("matched")) return;

    this.classList.add("flip");

    if (!firstCard) {

        firstCard = this;

        return;
    }

    secondCard = this;

    moves++;

    document.getElementById("moves").textContent = moves;

    checkMatch();
}

function checkMatch() {

    const match =
        firstCard.dataset.animal ===
        secondCard.dataset.animal;

    if (match) {

        firstCard.classList.add("matched");
        secondCard.classList.add("matched");

        score += 100;
        matchedPairs++;

        document.getElementById("score").textContent = score;

        resetCards();

        if (matchedPairs === animals.length) {

            clearInterval(timerInterval);

            setTimeout(() => {

                document.getElementById("winMessage").style.display = "block";

            }, 400);
        }

    } else {

        lockBoard = true;

        setTimeout(() => {

            firstCard.classList.remove("flip");
            secondCard.classList.remove("flip");

            resetCards();

        }, 800);
    }
}

function resetCards() {

    firstCard = null;
    secondCard = null;
    lockBoard = false;
}

startGame();

</script>

</body>
</html>
