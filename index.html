<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Picture Match</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#74ebd5,#9face6);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.game{
  width:100%;
  max-width:480px;
  text-align:center;
}

h1{
  color:white;
  margin-bottom:12px;
  text-shadow:0 2px 5px #555;
}

.stats{
  display:flex;
  justify-content:space-around;
  background:white;
  padding:12px 5px;
  border-radius:15px;
  margin-bottom:15px;
  font-weight:bold;
}

.board{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.card{
  aspect-ratio:1/1;
  perspective:800px;
  cursor:pointer;
}

.inner{
  width:100%;
  height:100%;
  position:relative;
  transition:.45s;
  transform-style:preserve-3d;
}

.card.flip .inner{
  transform:rotateY(180deg);
}

.front,.back{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:14px;
  overflow:hidden;
  backface-visibility:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,.25);
}

.front{
  background:linear-gradient(135deg,#ff7e5f,#feb47b);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:35px;
  color:white;
}

.back{
  background:white;
  transform:rotateY(180deg);
}

.back img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.matched .back{
  border:4px solid #32cd32;
}

button{
  margin-top:18px;
  padding:13px 30px;
  border:0;
  border-radius:30px;
  background:#222;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.win{
  display:none;
  margin-top:15px;
  background:white;
  padding:15px;
  border-radius:15px;
  font-weight:bold;
  font-size:19px;
}
</style>
</head>

<body>

<div class="game">

<h1>🐾 Animal Picture Match</h1>

<div class="stats">
 <span>Moves: <b id="moves">0</b></span>
 <span>Time: <b id="time">0</b>s</span>
 <span>Score: <b id="score">0</b></span>
</div>

<div class="board" id="board"></div>

<div class="win" id="win">
🎉 Amazing! You matched all animals!
</div>

<button onclick="startGame()">🔄 Play Again</button>

</div>

<script>

const animals = [
 {
  name:"dog",
  img:"https://images.unsplash.com/photo-1552053831-71594a27632d?w=400"
 },
 {
  name:"cat",
  img:"https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=400"
 },
 {
  name:"lion",
  img:"https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=400"
 },
 {
  name:"tiger",
  img:"https://images.unsplash.com/photo-1561731216-c3a4d99437d5?w=400"
 },
 {
  name:"panda",
  img:"https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?w=400"
 },
 {
  name:"monkey",
  img:"https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?w=400"
 },
 {
  name:"elephant",
  img:"https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?w=400"
 },
 {
  name:"giraffe",
  img:"https://images.unsplash.com/photo-1547721064-da6cfb341d50?w=400"
 }
];

let first=null;
let second=null;
let lock=false;

let moves=0;
let score=0;
let matched=0;

let seconds=0;
let timer=null;
let started=false;

function startGame(){

 clearInterval(timer);

 first=null;
 second=null;
 lock=false;

 moves=0;
 score=0;
 matched=0;
 seconds=0;
 started=false;

 document.getElementById("moves").innerText=0;
 document.getElementById("score").innerText=0;
 document.getElementById("time").innerText=0;

 document.getElementById("win").style.display="none";

 const board=document.getElementById("board");

 board.innerHTML="";

 let cards=[...animals,...animals];

 cards.sort(()=>Math.random()-0.5);

 cards.forEach(animal=>{

  const card=document.createElement("div");

  card.className="card";

  card.dataset.name=animal.name;

  card.innerHTML=`

  <div class="inner">

   <div class="front">
    ❓
   </div>

   <div class="back">
    <img src="${animal.img}" alt="${animal.name}">
   </div>

  </div>

  `;

  card.onclick=flipCard;

  board.appendChild(card);

 });

}

function startTimer(){

 if(started)return;

 started=true;

 timer=setInterval(()=>{

  seconds++;

  document.getElementById("time").innerText=seconds;

 },1000);

}

function flipCard(){

 if(lock)return;

 if(this===first)return;

 if(this.classList.contains("matched"))return;

 startTimer();

 this.classList.add("flip");

 if(!first){

  first=this;

  return;

 }

 second=this;

 moves++;

 document.getElementById("moves").innerText=moves;

 checkCards();

}

function checkCards(){

 if(first.dataset.name===second.dataset.name){

  first.classList.add("matched");

  second.classList.add("matched");

  score+=100;

  matched++;

  document.getElementById("score").innerText=score;

  reset();

  if(matched===animals.length){

   clearInterval(timer);

   setTimeout(()=>{

    document.getElementById("win").style.display="block";

   },500);

  }

 }else{

  lock=true;

  setTimeout(()=>{

   first.classList.remove("flip");

   second.classList.remove("flip");

   reset();

  },900);

 }

}

function reset(){

 first=null;
 second=null;
 lock=false;

}

startGame();

</script>

</body>
</html>
